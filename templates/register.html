<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign up | ShopNova</title>
<style>
body{font-family:Arial;background:#f3f6fc;margin:0;padding:22px}
.box{max-width:420px;margin:30px auto;background:white;padding:24px;border-radius:15px;box-shadow:0 8px 28px #17203312}
input{width:100%;padding:13px;margin:9px 0;border:1px solid #ccd4e2;border-radius:8px;font-size:16px}
button,.btn{display:block;width:100%;padding:13px;border:0;border-radius:8px;background:#2858d9;color:white;text-align:center;font-size:16px;text-decoration:none}
p{line-height:1.5}.msg{background:#fff0e5;padding:10px;border-radius:7px}
</style>
</head>
<body>
<div class="box">
<h1>Join ShopNova</h1>
<p>Create your customer account.</p>
{% for msg in get_flashed_messages() %}<p class="msg">{{ msg }}</p>{% endfor %}
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Your name</label>
<input name="name" maxlength="80" required autocomplete="name">
<label>Email address</label>
<input type="email" name="email" maxlength="254" required autocomplete="email">
<label>Password (minimum 10 characters)</label>
<input type="password" name="password" minlength="10" required autocomplete="new-password">
<button type="submit">Create account</button>
</form>
<p>Already registered? <a href="{{ url_for('login') }}">Login</a></p>
<p><a href="{{ url_for('home') }}">← Back to store</a></p>
</div>
</body>
</html>
